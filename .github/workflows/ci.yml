name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  # ActionsにRunボタン追加
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    # PostgreSQLのサービスコンテナ
    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: rails_test_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y google-chrome-stable libpq-dev

      - name: Checkout code
        uses: actions/checkout@v7

      # Nodeセットアップ
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: src

      # Node.jsのパッケージをインストール
      - name: Install JS dependencies
        working-directory: src
        run: npm ci

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: password
          DATABASE_HOST: localhost
          DATABASE_URL: postgres://postgres:password@localhost:5432/rails_test_test
          PUSHER_URL: https://dummy_key:dummy_secret@api.pusherapp.com/apps/12345
          APP_JWT_SECRET: dummy_secret
        working-directory: src
        run: bin/rails db:test:prepare test test:system
