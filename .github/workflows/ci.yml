name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-24.04

    # PostgreSQLのサービスコンテナを追加
    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: rails_test_test # ★ database.yml の test用DB名に合わせる
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libyaml-dev pkg-config google-chrome-stable libpq-dev

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: src

      - name: Run tests
        # database.yml が参照する環境変数と、テスト環境用の変数を指定
        env:
          RAILS_ENV: test
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: password
          DATABASE_HOST: localhost
          DATABASE_URL: postgres://postgres:password@localhost:5432/rails_test_test # ★ DB名を rails_test_test に統一
          PUSHER_URL: https://dummy_key:dummy_secret@api.pusherapp.com/apps/12345
        working-directory: src
        run: bin/rails db:test:prepare test test:system
